/* ---------------- SNAKE ---------------- */
function Snake(){
  var CW = 8, COLS = 28, ROWS = 14, OX = 8, OY = 22;
  var self = this;
  this.id = "snake"; this.name = "SNAKE"; this.usesB = false;

  function freeCell(){
    for (var guard = 0; guard < 400; guard++){
      var c = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      var hit = false;
      for (var i = 0; i < self.body.length; i++)
        if (self.body[i].x === c.x && self.body[i].y === c.y){ hit = true; break; }
      if (!hit) return c;
    }
    return { x:0, y:0 };
  }

  this.reset = function(){
    this.body = [{ x:6, y:7 }, { x:5, y:7 }, { x:4, y:7 }];
    this.dir = { x:1, y:0 }; this.next = { x:1, y:0 };
    this.score = 0; this.over = false; this.t = 0;
    this.food = freeCell();
  };

  this.press = function(k){
    var d = this.dir;
    if (k === "left"  && d.x !==  1) this.next = { x:-1, y:0 };
    if (k === "right" && d.x !== -1) this.next = { x: 1, y:0 };
    if (k === "up"    && d.y !==  1) this.next = { x:0, y:-1 };
    if (k === "down"  && d.y !== -1) this.next = { x:0, y: 1 };
  };

  this.update = function(dt){
    var every = Math.max(3.5, 9 - this.score / 30);
    this.t += dt;
    if (this.t < every) return;
    this.t = 0;
    this.dir = this.next;
    var h = { x: this.body[0].x + this.dir.x, y: this.body[0].y + this.dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS){ this.die(); return; }
    for (var i = 0; i < this.body.length - 1; i++)
      if (this.body[i].x === h.x && this.body[i].y === h.y){ this.die(); return; }
    this.body.unshift(h);
    if (h.x === this.food.x && h.y === this.food.y){ this.score += 10; this.food = freeCell(); sfx("point"); }
    else this.body.pop();
  };

  this.die = function(){ endGame(this); };

  this.draw = function(){
    sr(0, 0, W, H, C.black);
    sr(OX - 2, OY - 2, COLS * CW + 4, ROWS * CW + 4, C.ink);
    sr(OX - 2, OY - 2, COLS * CW + 4, 1, C.slate);
    sr(OX - 2, OY + ROWS * CW + 1, COLS * CW + 4, 1, C.slate);
    for (var gx = 0; gx < COLS; gx += 2)
      for (var gy = 0; gy < ROWS; gy += 2)
        sr(OX + gx * CW, OY + gy * CW, 1, 1, mix(C.ink, C.slate, 0.6));
    sr(OX + this.food.x * CW + 1, OY + this.food.y * CW + 1, CW - 2, CW - 2, C.gold);
    sr(OX + this.food.x * CW + 2, OY + this.food.y * CW + 2, 2, 2, C.paper);
    for (var i = this.body.length - 1; i >= 0; i--){
      var b = this.body[i];
      sr(OX + b.x * CW, OY + b.y * CW, CW - 1, CW - 1, i ? C.moss : C.cyan);
      if (!i) sr(OX + b.x * CW + 2, OY + b.y * CW + 2, 2, 2, C.ink);
    }
    gameBar(this);
    textCentre("length " + this.body.length, W / 2, 148, C.grey);
    if (this.over) gameOverCard(this);
  };
}

/* ---------------- ASTEROIDS ---------------- */
function Roids(){
  var TOP = 16;
  this.id = "roids"; this.name = "ASTEROIDS"; this.usesB = true;

  function rock(x, y, r){
    var shape = [], n = 9;
    for (var i = 0; i < n; i++) shape.push(0.72 + Math.random() * 0.5);
    var a = Math.random() * 6.283, sp = (0.35 + Math.random() * 0.5) * (14 / r);
    return { x:x, y:y, r:r, shape:shape, ang:Math.random() * 6.283,
             spin:(Math.random() - 0.5) * 0.04, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp };
  }

  this.reset = function(){
    this.ship = { x:W / 2, y:(H + TOP) / 2, a:-1.57, vx:0, vy:0 };
    this.bul = []; this.rocks = []; this.bits = [];
    this.score = 0; this.lives = 3; this.over = false;
    this.wave = 0; this.safe = 60; this.cool = 0;
    this.spawnWave();
  };

  this.spawnWave = function(){
    this.wave++;
    var n = Math.min(7, 3 + this.wave);
    for (var i = 0; i < n; i++){
      var x = Math.random() * W, y = TOP + Math.random() * (H - TOP);
      if (Math.abs(x - this.ship.x) < 46 && Math.abs(y - this.ship.y) < 46){ x = (x + 110) % W; }
      this.rocks.push(rock(x, y, 13));
    }
  };

  this.press = function(k){
    if (k === "b" && this.cool <= 0){
      var s = this.ship;
      this.bul.push({ x:s.x + Math.cos(s.a) * 6, y:s.y + Math.sin(s.a) * 6,
                      vx:Math.cos(s.a) * 3.4 + s.vx, vy:Math.sin(s.a) * 3.4 + s.vy, life:46 });
      this.cool = 7;
    }
  };

  this.hurt = function(){
    this.lives--;
    this.ship.x = W / 2; this.ship.y = (H + TOP) / 2;
    this.ship.vx = 0; this.ship.vy = 0; this.ship.a = -1.57;
    this.safe = 90;
    for (var i = 0; i < 14; i++)
      this.bits.push({ x:this.ship.x, y:this.ship.y, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, life:30 });
    if (this.lives <= 0) endGame(this);
  };

  this.update = function(dt){
    var s = this.ship, i, j;
    if (keys.left)  s.a -= 0.075 * dt;
    if (keys.right) s.a += 0.075 * dt;
    if (keys.a){
      s.vx += Math.cos(s.a) * 0.09 * dt;
      s.vy += Math.sin(s.a) * 0.09 * dt;
      if (!reduceMotion && Math.random() < 0.5)
        this.bits.push({ x:s.x - Math.cos(s.a) * 6, y:s.y - Math.sin(s.a) * 6,
                         vx:-Math.cos(s.a), vy:-Math.sin(s.a), life:10 });
    }
    s.vx *= Math.pow(0.992, dt); s.vy *= Math.pow(0.992, dt);
    var sp = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
    if (sp > 2.6){ s.vx = s.vx / sp * 2.6; s.vy = s.vy / sp * 2.6; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (this.cool > 0) this.cool -= dt;
    if (this.safe > 0) this.safe -= dt;

    function wrapAll(o, r){
      if (o.x < -r) o.x += W + r * 2; if (o.x > W + r) o.x -= W + r * 2;
      if (o.y < TOP - r) o.y += H - TOP + r * 2; if (o.y > H + r) o.y -= H - TOP + r * 2;
    }
    wrapAll(s, 6);

    for (i = this.bul.length - 1; i >= 0; i--){
      var b = this.bul[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      wrapAll(b, 1);
      if (b.life <= 0) this.bul.splice(i, 1);
    }
    for (i = this.bits.length - 1; i >= 0; i--){
      var p = this.bits[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) this.bits.splice(i, 1);
    }

    for (i = this.rocks.length - 1; i >= 0; i--){
      var r = this.rocks[i];
      r.x += r.vx * dt; r.y += r.vy * dt; r.ang += r.spin * dt;
      wrapAll(r, r.r);

      for (j = this.bul.length - 1; j >= 0; j--){
        var bb = this.bul[j];
        if ((bb.x - r.x) * (bb.x - r.x) + (bb.y - r.y) * (bb.y - r.y) < r.r * r.r){
          this.bul.splice(j, 1);
          this.split(i, r);
          break;
        }
      }
      if (this.safe <= 0 && !this.over){
        var dx = s.x - r.x, dy = s.y - r.y;
        if (dx * dx + dy * dy < (r.r + 4) * (r.r + 4)){ this.split(i, r); this.hurt(); }
      }
    }
    if (!this.rocks.length && !this.over) this.spawnWave();
  };

  this.split = function(i, r){
    this.rocks.splice(i, 1);
    this.score += r.r > 10 ? 20 : (r.r > 6 ? 50 : 100);
    sfx("hit");
    for (var k = 0; k < 8; k++)
      this.bits.push({ x:r.x, y:r.y, vx:(Math.random()-0.5)*2.4, vy:(Math.random()-0.5)*2.4, life:18 });
    if (r.r > 6){
      var nr = r.r > 10 ? 8 : 5;
      for (var m = 0; m < 2; m++) this.rocks.push(rock(r.x, r.y, nr));
    }
  };

  this.draw = function(){
    sr(0, 0, W, H, C.black);
    for (var st = 0; st < 26; st++)
      sr((rnd(st) * W) | 0, TOP + ((rnd(st + 50) * (H - TOP)) | 0), 1, 1, mix(C.slate, C.mist, rnd(st + 9)));

    var i, k;
    for (i = 0; i < this.rocks.length; i++){
      var r = this.rocks[i];
      for (var pass = -1; pass <= 1; pass++){
        var ox = pass * W;
        if (r.x + ox < -r.r - 2 || r.x + ox > W + r.r + 2) continue;
        var pts = [];
        for (k = 0; k < r.shape.length; k++){
          var ang = r.ang + k / r.shape.length * 6.283;
          pts.push([r.x + ox + Math.cos(ang) * r.r * r.shape[k], r.y + Math.sin(ang) * r.r * r.shape[k]]);
        }
        fillPoly(pts, mix(C.slate, C.grey, 0.65));
        for (k = 0; k < pts.length; k++) sr(pts[k][0], pts[k][1], 1, 1, C.mist);
        sr(r.x + ox - 1, r.y - 2, 2, 2, mix(C.slate, C.black, 0.4));
      }
    }
    for (i = 0; i < this.bits.length; i++)
      sr(this.bits[i].x, this.bits[i].y, 1, 1, this.bits[i].life > 12 ? C.gold : C.rust);
    for (i = 0; i < this.bul.length; i++)
      sr(this.bul[i].x, this.bul[i].y, 2, 2, C.paper);

    if (!this.over && (this.safe <= 0 || Math.floor(now / 90) % 2)){
      var s = this.ship;
      fillPoly([
        [s.x + Math.cos(s.a) * 7,          s.y + Math.sin(s.a) * 7],
        [s.x + Math.cos(s.a + 2.5) * 6,    s.y + Math.sin(s.a + 2.5) * 6],
        [s.x + Math.cos(s.a - 2.5) * 6,    s.y + Math.sin(s.a - 2.5) * 6]
      ], C.cyan);
    }

    gameBar(this);
    for (i = 0; i < this.lives; i++) sr(6 + i * 6, 149, 4, 4, C.cyan);
    textRight("wave " + this.wave, W - 6, 148, C.grey);
    if (this.over) gameOverCard(this);
  };
}

/* ---------------- BREAKOUT ---------------- */
function Brick(){
  var TOP = 16, COLS = 10, ROWS = 5, BW = 22, BH = 7, OX = 5, OY = 30;
  this.id = "brick"; this.name = "BREAKOUT"; this.usesB = false;

  this.reset = function(){
    this.bricks = [];
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        this.bricks.push({ x:OX + c * BW, y:OY + r * BH * 1.6, alive:true, row:r });
    this.pad = { x:W / 2, w:34 };
    this.score = 0; this.lives = 3; this.over = false;
    this.stuck = true;
    this.ball = { x:W / 2, y:132, vx:1.5, vy:-1.7, r:2 };
  };

  this.press = function(k){ if (k === "a") this.stuck = false; };

  this.update = function(dt){
    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    this.pad.x += dir * 2.6 * dt;
    this.pad.x = Math.max(this.pad.w / 2, Math.min(W - this.pad.w / 2, this.pad.x));

    var b = this.ball;
    if (this.stuck){ b.x = this.pad.x; b.y = 132; return; }

    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < 2){ b.x = 2; b.vx = Math.abs(b.vx); }
    if (b.x > W - 2){ b.x = W - 2; b.vx = -Math.abs(b.vx); }
    if (b.y < TOP + 2){ b.y = TOP + 2; b.vy = Math.abs(b.vy); }

    if (b.y > 134 && b.y < 140 && b.vy > 0 &&
        Math.abs(b.x - this.pad.x) < this.pad.w / 2 + 2){
      b.vy = -Math.abs(b.vy);
      b.vx += (b.x - this.pad.x) * 0.075;
      b.vx = Math.max(-2.6, Math.min(2.6, b.vx));
    }

    if (b.y > H){
      this.lives--;
      this.stuck = true;
      b.vx = 1.5; b.vy = -1.7;
      if (this.lives <= 0) endGame(this);
      return;
    }

    var live = 0;
    for (var i = 0; i < this.bricks.length; i++){
      var k = this.bricks[i];
      if (!k.alive) continue;
      live++;
      if (b.x > k.x - 1 && b.x < k.x + BW - 1 && b.y > k.y - 1 && b.y < k.y + BH){
        k.alive = false;
        this.score += (ROWS - k.row) * 5;
        sfx("point");
        var ox = Math.min(Math.abs(b.x - k.x), Math.abs(b.x - (k.x + BW)));
        var oy = Math.min(Math.abs(b.y - k.y), Math.abs(b.y - (k.y + BH)));
        if (oy < ox) b.vy = -b.vy; else b.vx = -b.vx;
        b.vx *= 1.012; b.vy *= 1.012;
        live--;
        break;
      }
    }
    if (!live){
      for (var j = 0; j < this.bricks.length; j++) this.bricks[j].alive = true;
      this.stuck = true;
      b.vx *= 1.1; b.vy *= 1.1;
      this.score += 50;
      sfx("point");
    }
  };

  this.draw = function(){
    sr(0, 0, W, H, C.black);
    sr(0, TOP, W, H - TOP, mix(C.night, C.black, 0.6));
    var cols = [C.red, C.rust, C.gold, C.moss, C.cyan];
    for (var i = 0; i < this.bricks.length; i++){
      var k = this.bricks[i];
      if (!k.alive) continue;
      sr(k.x, k.y, BW - 2, BH - 2, cols[k.row]);
      sr(k.x, k.y, BW - 2, 1, mix(cols[k.row], C.paper, 0.4));
    }
    sr(this.pad.x - this.pad.w / 2, 136, this.pad.w, 4, C.mist);
    sr(this.pad.x - this.pad.w / 2, 136, this.pad.w, 1, C.paper);
    sr(this.ball.x - 2, this.ball.y - 2, 4, 4, C.gold);

    gameBar(this);
    for (var l = 0; l < this.lives; l++) sr(6 + l * 6, 149, 4, 4, C.gold);
    if (this.stuck && !this.over) textCentre("Space  serve", W / 2, 146, C.haze);
    if (this.over) gameOverCard(this);
  };
}

function startGame(id){
  G = id === "snake" ? new Snake() : (id === "roids" ? new Roids() : new Brick());
  G.reset();
  mode = "game";
  syncPad();
}

/* ===============================================================
   16e. THE END OF THE ROAD
   =============================================================== */
function clock(ms){
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return m + ":" + ("0" + (s % 60)).slice(-2);
}
function ridesCount(){
  var n = 0;
  for (var k in ridesUsed) if (ridesUsed[k]) n++;
  return n;
}
function drawEnd(){
  sr(0, 0, W, H, C.black);
  panel(2, 2, W - 4, H - 4, C.ink, C.gold);
  sr(3, 3, W - 6, 12, C.slate);
  text("THE END OF THE ROAD", 7, 4, C.gold);

  var full = seenCount() === SECTIONS.length;
  textCentre(full ? "You read the whole thing." : "You made it to the flag.", W / 2, 24, C.paper);

  var rows = [
    ["time",     clock(now - runStart)],
    ["stops read", seenCount() + " of " + SECTIONS.length],
    ["floppies",  disksFound() + " of " + DISKS.length],
    ["rides used", ridesCount() + " of " + VEHICLES.length]
  ];
  for (var i = 0; i < rows.length; i++){
    var y = 44 + i * 12;
    text(rows[i][0], 40, y, C.haze);
    textRight(rows[i][1], W - 40, y, C.mist);
  }

  var line = disksFound() === DISKS.length
    ? "Every floppy found. There is one more stop past this flag."
    : "There are " + (DISKS.length - disksFound()) + " floppies still out there.";
  var wl = wrap(line, 34);
  for (i = 0; i < wl.length && i < 2; i++) textCentre(wl[i], W / 2, 98 + i * 10, C.gold);

  textCentre("Thanks for playing.", W / 2, 120, C.cyan);
  textCentre("Stop 09 has his address on it.", W / 2, 131, C.haze);
  sr(3, H - 15, W - 6, 12, C.shadow);
  text("Space  stay", 7, H - 14, C.haze);
  textRight("Esc  the page", W - 7, H - 14, C.haze);
}

/* ---------------------------------------------------------------
   17. STARTING, AND GOING BACK TO THE PAGE
   --------------------------------------------------------------- */
function hashSection(){
  var id = (window.location.hash || "").replace(/^#/, "");
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return i;
  return -1;
}

function standingAt(){
  var best = -1, bestD = 1e9;
  for (var i = 0; i < STATIONS.length; i++){
    var d = Math.abs(P.x - STATIONS[i].x);
    if (d < bestD){ bestD = d; best = i; }
  }
  if (bestD >= 200 || best < 0) return "";
  var id = STATIONS[best].sec.id;
  return id === "secret" ? "" : id;
}

/* leaving hands the page whichever stop you were standing next to */
function goPage(){
  running = false;
  cancelAnimationFrame(raf);
  var id = standingAt();
  window.location.href = "index.html" + (id ? "#" + id : "");
}

function start(){
  var si = hashSection();
  P.x = si >= 0 ? STATIONS[si].x - 30 : 100;
  P.y = terrain(P.x); P.vx = 0; P.vy = 0; P.face = 1;
  camX = Math.max(0, Math.min(LEVEL - W, P.x - 108));
  camY = 0;
  setVehicle(0, true);

  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches && padEl) padEl.classList.add("on");

  runStart = performance.now();
  bootT = reduceMotion ? 0 : 26;
  endShown = false;
  trail = [];
  ridesUsed = {};

  running = true;
  mode = reduceMotion ? "world" : "intro";
  now = performance.now(); last = now;
  introUntil = now + 2600;
  hintUntil  = now + 7000;
  syncPad();
  resize();
  cv.focus();
  window.addEventListener("keydown", onKeyDown, { passive:false });
  window.addEventListener("keyup", onKeyUp);
  raf = requestAnimationFrame(frame);
}

btnExit.addEventListener("click", function(e){ e.preventDefault(); goPage(); });
btnMap.addEventListener("click", function(){
  if (!running) return;
  if (mode === "game"){ mode = "room"; syncPad(); cv.focus(); return; }
  if (mode === "room"){ leaveRoom(); cv.focus(); return; }
  if (mode === "end"){ mode = "world"; syncPad(); cv.focus(); return; }
  if (mode === "map") mode = "world";
  else { mapSel = Math.max(0, nearStation()); mode = "map"; }
  syncPad(); cv.focus();
});
btnHelp.addEventListener("click", function(){
  if (!running) return;
  mode = (mode === "help") ? "world" : "help";
  syncPad(); cv.focus();
});

/* ---------------------------------------------------------------
   18. READING THE PAGE THIS RUNS ON
   The words live in index.html and are fetched from there, so the
   two files can never fall out of step with one another.
   --------------------------------------------------------------- */
var loadEl = doc.getElementById("play-load");
var failEl = doc.getElementById("play-fail");

function fail(why){
  if (loadEl) loadEl.style.display = "none";
  if (failEl){
    failEl.style.display = "flex";
    var p = failEl.querySelector("[data-why]");
    if (p) p.textContent = why;
  }
}

function boot(d){
  src = d;
  harvest();
  if (!SECTIONS.length){
    fail("index.html came back, but none of its sections were in it.");
    return;
  }
  layout();
  if (loadEl) loadEl.style.display = "none";
  start();
}

if (!window.fetch || !window.DOMParser){
  fail("This browser cannot fetch the page content.");
} else {
  window.fetch("index.html", { cache:"no-cache" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){ boot(new DOMParser().parseFromString(t, "text/html")); })
    .catch(function(){
      fail("Arcade mode reads its words straight out of index.html, so it needs the site served over http. Opening the file off the disk will not work.");
    });
}

})();
</script>
