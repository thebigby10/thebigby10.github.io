<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade — Md. Abidur Rahman</title>
<meta name="description" content="A side-scrolling pixel version of Md. Abidur Rahman's portfolio. The same nine sections, walked, cycled, bounced, driven or flown through.">
<meta name="robots" content="noindex">
<link rel="canonical" href="index.html">
<meta name="theme-color" content="#0a0910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111'/><text y='74' x='50' text-anchor='middle' font-family='Helvetica,Arial' font-size='64' font-weight='700' fill='%23fff'>A</text></svg>">

<style>
:root{
  --f-sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans","Nimbus Sans",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0910;}
html{-webkit-text-size-adjust:100%;}
a{color:inherit;text-decoration:none;}

/* the mode switch, in the dark */
.modesw{display:flex;border:2px solid #35314a;}
.modesw-b{
  display:block;font:inherit;
  font-family:var(--f-sans);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  background:rgba(12,11,18,.72);color:#b9b5cd;border:0;
  padding:8px 11px;line-height:1;cursor:pointer;
}
.modesw-b + .modesw-b{border-left:2px solid #35314a;}
a.modesw-b:hover{color:#fff;background:#221f31;}
.modesw-b.is-on{background:#e0b56a;color:#14121e;}

/* loading and failure states */
.play-note{
  position:absolute;inset:0;z-index:6;
  display:flex;align-items:center;justify-content:center;
  padding:32px;text-align:center;
  font-family:var(--f-sans);
  background:#0a0910;
}
#play-fail{display:none;}
.play-note h1{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:#e0b56a;margin:0 0 14px;
}
.play-note p{
  font-size:15px;line-height:1.5;color:#b9b5cd;
  margin:0 auto 20px;max-width:36em;
}
.play-note a{
  display:inline-block;border:2px solid #35314a;
  padding:10px 13px;line-height:1;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:#e8e6f2;
}
.play-note a:hover{border-color:#e0b56a;color:#fff;}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }

/* ============================================================
   ARCADE MODE
   ============================================================ */
#play{
  position:fixed;inset:0;z-index:1;
  display:block;
  background:#0a0910;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:8px 8px,8px 8px;
  color:#e8e6f2;
  font-family:var(--f-sans);
  touch-action:none;
  user-select:none;-webkit-user-select:none;
}

#screen{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  background:#000;
  box-shadow:0 0 0 2px #1d1b28,0 0 0 5px #0a0910,0 18px 60px rgba(0,0,0,.7);
  display:block;
}

/* chrome buttons pinned to the viewport, not the pixel canvas */
.play-chrome{
  position:absolute;top:14px;right:14px;
  display:flex;gap:8px;z-index:3;
}
.pbtn{
  font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  background:rgba(12,11,18,.72);color:#b9b5cd;
  border:2px solid #35314a;
  padding:8px 11px;line-height:1;cursor:pointer;
}
.pbtn:hover{color:#fff;border-color:#7d76a6;}
.pbtn:active{transform:translateY(1px);}
#play :focus-visible{outline:2px solid #e0b56a;outline-offset:2px;}

/* touch pad */
.pad{
  position:absolute;bottom:0;left:0;right:0;
  display:none;
  justify-content:space-between;align-items:flex-end;
  padding:0 14px 16px;
  z-index:3;pointer-events:none;
}
.pad.on{display:flex;}
.pad-l,.pad-r{display:flex;gap:10px;pointer-events:auto;}
.pad button{
  font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  width:58px;height:58px;
  background:rgba(20,18,30,.8);color:#cfcbe0;
  border:2px solid #3d3856;
  cursor:pointer;line-height:1.1;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.pad button.hot{background:#e0b56a;color:#14121e;border-color:#e0b56a;}
.pad .arrow{font-size:20px;letter-spacing:0;}
@media (max-width:900px){ .pad-l,.pad-r{gap:8px;} .pad button{width:52px;height:52px;} }

.play-sr{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;
}
</style>
</head>
<body>

<!-- ================= ARCADE MODE ================= -->
<div id="play">
  <p class="play-sr">Arcade mode is a decorative side-scrolling view of this page. Every word in it also appears in the standard page. Press Escape to go back.</p>

  <canvas id="screen" width="240" height="160" tabindex="0" role="img"
          aria-label="Pixel-art side-scrolling view of the portfolio"></canvas>

  <div class="play-chrome">
    <button type="button" class="pbtn" id="pb-snd" aria-pressed="false">Mute</button>
    <button type="button" class="pbtn" id="pb-map">Map</button>
    <button type="button" class="pbtn" id="pb-help">Keys</button>
    <div class="modesw" aria-label="Reading mode">
      <a class="modesw-b" id="pb-exit" href="index.html">Page</a>
      <span class="modesw-b is-on" aria-current="page">Arcade</span>
    </div>
  </div>

  <div class="play-note" id="play-load">
    <div>
      <h1>Loading</h1>
      <p>Fetching the words from the standard page.</p>
    </div>
  </div>

  <div class="play-note" id="play-fail">
    <div>
      <h1>Cannot read the page</h1>
      <p data-why></p>
      <a href="index.html">Go to the standard page</a>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="pad-l">
      <button type="button" class="arrow" data-k="left" aria-label="Move left">&#9664;</button>
      <button type="button" class="arrow" data-k="right" aria-label="Move right">&#9654;</button>
    </div>
    <div class="pad-r">
      <button type="button" data-k="b" id="pad-b">Ride</button>
      <button type="button" data-k="a" id="pad-a">Jump</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   ARCADE MODE
   A 240x160 side-scrolling reader for the same content as the page.
   Everything below is drawn from code: no image files, no libraries.
   ================================================================ */
(function(){
"use strict";

var doc = document;
var src = null;                     /* the standard page, fetched and parsed */
var cv = doc.getElementById("screen");
if (!cv) return;
var ctx = cv.getContext("2d", { alpha:false });
ctx.imageSmoothingEnabled = false;

var W = 240, H = 160;
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------------------------------------------------------
   1. PALETTE
   Sixteen colours. Ink and paper are borrowed from the page so the
   two modes read as the same site; the rest is a dusk-to-night run.
   --------------------------------------------------------------- */
var C = {
  black:"#0a0910", ink:"#16141f", shadow:"#221f31", slate:"#37324a",
  grey:"#5b5474",  haze:"#8b84a6", mist:"#bfb9d4",  paper:"#f4f2fa",
  night:"#1b2a44", deep:"#2d4a6b", sky:"#4b7fa6",   cyan:"#8fcfdd",
  gold:"#e0b56a",  rust:"#b9713c", red:"#d1544f",   moss:"#5f9d63"
};

/* ---------------------------------------------------------------
   2. FONT  — 5x8 cell, 7px caps, real descenders.
   "offset|rows" where each row is five bits, top row first.
   --------------------------------------------------------------- */
var GLYPHS = {
"A":"0|01110 10001 10001 11111 10001 10001 10001",
"B":"0|11110 10001 10001 11110 10001 10001 11110",
"C":"0|01110 10001 10000 10000 10000 10001 01110",
"D":"0|11100 10010 10001 10001 10001 10010 11100",
"E":"0|11111 10000 10000 11110 10000 10000 11111",
"F":"0|11111 10000 10000 11110 10000 10000 10000",
"G":"0|01110 10001 10000 10111 10001 10001 01111",
"H":"0|10001 10001 10001 11111 10001 10001 10001",
"I":"0|01110 00100 00100 00100 00100 00100 01110",
"J":"0|00111 00010 00010 00010 00010 10010 01100",
"K":"0|10001 10010 10100 11000 10100 10010 10001",
"L":"0|10000 10000 10000 10000 10000 10000 11111",
"M":"0|10001 11011 10101 10101 10001 10001 10001",
"N":"0|10001 11001 11001 10101 10011 10011 10001",
"O":"0|01110 10001 10001 10001 10001 10001 01110",
"P":"0|11110 10001 10001 11110 10000 10000 10000",
"Q":"0|01110 10001 10001 10001 10101 10010 01101",
"R":"0|11110 10001 10001 11110 10100 10010 10001",
"S":"0|01111 10000 10000 01110 00001 00001 11110",
"T":"0|11111 00100 00100 00100 00100 00100 00100",
"U":"0|10001 10001 10001 10001 10001 10001 01110",
"V":"0|10001 10001 10001 10001 10001 01010 00100",
"W":"0|10001 10001 10001 10101 10101 10101 01010",
"X":"0|10001 10001 01010 00100 01010 10001 10001",
"Y":"0|10001 10001 01010 00100 00100 00100 00100",
"Z":"0|11111 00001 00010 00100 01000 10000 11111",

"a":"2|01110 00001 01111 10001 01111",
"b":"0|10000 10000 11110 10001 10001 10001 11110",
"c":"2|01110 10001 10000 10001 01110",
"d":"0|00001 00001 01111 10001 10001 10001 01111",
"e":"2|01110 10001 11111 10000 01110",
"f":"0|00110 01001 01000 11100 01000 01000 01000",
"g":"2|01111 10001 10001 01111 00001 01110",
"h":"0|10000 10000 11110 10001 10001 10001 10001",
"i":"0|00100 00000 01100 00100 00100 00100 01110",
"j":"0|00010 00000 00110 00010 00010 00010 10010 01100",
"k":"0|10000 10000 10010 10100 11000 10100 10010",
"l":"0|01100 00100 00100 00100 00100 00100 01110",
"m":"2|11010 10101 10101 10101 10101",
"n":"2|11110 10001 10001 10001 10001",
"o":"2|01110 10001 10001 10001 01110",
"p":"2|11110 10001 10001 11110 10000 10000",
"q":"2|01111 10001 10001 01111 00001 00001",
"r":"2|10110 11001 10000 10000 10000",
"s":"2|01111 10000 01110 00001 11110",
"t":"0|01000 01000 11100 01000 01000 01001 00110",
"u":"2|10001 10001 10001 10011 01101",
"v":"2|10001 10001 10001 01010 00100",
"w":"2|10001 10101 10101 10101 01010",
"x":"2|10001 01010 00100 01010 10001",
"y":"2|10001 10001 10001 01111 00001 01110",
"z":"2|11111 00010 00100 01000 11111",

"0":"0|01110 10001 10011 10101 11001 10001 01110",
"1":"0|00100 01100 00100 00100 00100 00100 01110",
"2":"0|01110 10001 00001 00010 00100 01000 11111",
"3":"0|11111 00010 00100 00010 00001 10001 01110",
"4":"0|00010 00110 01010 10010 11111 00010 00010",
"5":"0|11111 10000 11110 00001 00001 10001 01110",
"6":"0|00110 01000 10000 11110 10001 10001 01110",
"7":"0|11111 00001 00010 00100 01000 01000 01000",
"8":"0|01110 10001 10001 01110 10001 10001 01110",
"9":"0|01110 10001 10001 01111 00001 00010 01100",

".":"5|01100 01100",
",":"5|00110 00110 01100",
":":"2|01100 01100 00000 01100 01100",
";":"2|00110 00110 00000 00110 01100",
"!":"0|00100 00100 00100 00100 00100 00000 00100",
"?":"0|01110 10001 00001 00010 00100 00000 00100",
"'":"0|00110 00110 01100",
"\"":"0|01010 01010 01010",
"-":"3|11111",
"+":"1|00100 00100 11111 00100 00100",
"=":"2|11111 00000 00000 11111",
"*":"1|00100 10101 01110 10101 00100",
"/":"0|00001 00010 00010 00100 01000 01000 10000",
"\\":"0|10000 01000 01000 00100 00010 00010 00001",
"(":"0|00010 00100 01000 01000 01000 00100 00010",
")":"0|01000 00100 00010 00010 00010 00100 01000",
"[":"0|01110 01000 01000 01000 01000 01000 01110",
"]":"0|01110 00010 00010 00010 00010 00010 01110",
"&":"0|01100 10010 10010 01100 10101 10010 01101",
"@":"0|01110 10001 10111 10101 10111 10000 01110",
"#":"0|01010 01010 11111 01010 11111 01010 01010",
"%":"0|11001 11010 00010 00100 01000 01011 10011",
"_":"6|11111",
"|":"0|00100 00100 00100 00100 00100 00100 00100",
"<":"0|00010 00100 01000 10000 01000 00100 00010",
">":"0|01000 00100 00010 00001 00010 00100 01000",
"~":"3|01001 10110",
"\u00b7":"3|01100 01100",
"\u00b0":"0|01100 10010 01100",
"\u2022":"2|01110 11111 11111 01110",
"\u25b6":"0|10000 11000 11100 11110 11100 11000 10000",
"\u25c0":"0|00001 00011 00111 01111 00111 00011 00001",
"\u25bc":"3|11111 01110 00100",
"\u25b2":"3|00100 01110 11111",
"\u2713":"1|00001 00010 10100 01000 00000"
};

var CELL_W = 6, CELL_H = 8, LINE_H = 9;
var order = [], parsed = {};
(function parseFont(){
  for (var ch in GLYPHS){
    if (!Object.prototype.hasOwnProperty.call(GLYPHS,ch)) continue;
    var bits = GLYPHS[ch].split("|");
    parsed[ch] = { o:parseInt(bits[0],10), rows:bits[1].split(" ") };
    order.push(ch);
  }
})();

/* Characters the font does not carry get folded onto ones it does. */
var FOLD = {
  "\u2018":"'", "\u2019":"'", "\u201c":"\"", "\u201d":"\"",
  "\u2013":"-", "\u2014":"-", "\u2212":"-", "\u00a0":" ",
  "\u2192":"\u25b6", "\u2026":"...", "\u00d7":"x", "\u20b9":"Rs"
};
function fold(s){
  s = String(s == null ? "" : s);
  var out = "", i, ch;
  for (i = 0; i < s.length; i++){
    ch = s.charAt(i);
    if (FOLD[ch] !== undefined) { out += FOLD[ch]; continue; }
    out += (parsed[ch] || ch === " ") ? ch : "?";
  }
  return out;
}

/* One atlas canvas per colour, built the first time that colour is used. */
var atlases = {};
function atlas(color){
  if (atlases[color]) return atlases[color];
  var a = doc.createElement("canvas");
  a.width = order.length * CELL_W;
  a.height = CELL_H;
  var g = a.getContext("2d");
  g.fillStyle = color;
  for (var i = 0; i < order.length; i++){
    var gl = parsed[order[i]], ox = i * CELL_W;
    for (var r = 0; r < gl.rows.length; r++){
      var row = gl.rows[r], y = gl.o + r;
      if (y >= CELL_H) continue;
      for (var c = 0; c < row.length; c++){
        if (row.charAt(c) === "1") g.fillRect(ox + c, y, 1, 1);
      }
    }
  }
  var rec = { cv:a, idx:{} };
  for (var k = 0; k < order.length; k++) rec.idx[order[k]] = k * CELL_W;
  atlases[color] = rec;
  return rec;
}

function textWidth(s){ return fold(s).length * CELL_W; }

function text(s, x, y, color){
  var a = atlas(color || C.paper);
  s = fold(s);
  var px = x | 0;
  for (var i = 0; i < s.length; i++){
    var ch = s.charAt(i);
    if (ch !== " "){
      var sx = a.idx[ch];
      if (sx === undefined) sx = a.idx["?"];
      if (sx !== undefined) ctx.drawImage(a.cv, sx, 0, CELL_W, CELL_H, px, y | 0, CELL_W, CELL_H);
    }
    px += CELL_W;
  }
  return px;
}

function textRight(s, x, y, color){ return text(s, x - textWidth(s), y, color); }
function textCentre(s, cx, y, color){ return text(s, Math.round(cx - textWidth(s) / 2), y, color); }

/* Greedy word wrap, measured in characters because the font is fixed width. */
function wrap(s, cols){
  s = fold(s);
  var words = s.split(/\s+/), lines = [], line = "";
  for (var i = 0; i < words.length; i++){
    var w = words[i];
    if (!w) continue;
    while (w.length > cols){
      if (line) { lines.push(line); line = ""; }
      lines.push(w.slice(0, cols));
      w = w.slice(cols);
    }
    if (!line) line = w;
    else if (line.length + 1 + w.length <= cols) line += " " + w;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------------------------------------------------------------
   3. CONTENT
   Read straight out of the page so the two modes can never drift
   apart. Edit the HTML and arcade mode updates with it.
   --------------------------------------------------------------- */
var SECTION_IDS = ["experience","projects","games","design","achievements","open-source","skills","education","contact"];

function txt(el){ return el ? el.textContent.replace(/\s+/g," ").trim() : ""; }

function harvestCards(sec){
  var cards = [], i, j;

  var nodes = sec.querySelectorAll(".entry, .project, .ach, .edu, .skillrow");
  for (i = 0; i < nodes.length; i++){
    var n = nodes[i], card = { title:"", meta:"", when:"", body:[], tags:[], links:[] };

    card.title = txt(n.querySelector(".h3"));
    card.meta  = txt(n.querySelector(".org")) || txt(n.querySelector(".p-kind"));
    if (n.querySelector(".p-kind") && n.querySelector(".org")) card.meta = txt(n.querySelector(".org"));
    card.when  = txt(n.querySelector(".entry-when .label")) ||
                 txt(n.querySelector(".ach-rank .label")) ||
                 txt(n.querySelector(".edu-when .label")) ||
                 txt(n.querySelector(".ach-year .label"));

    var flag = n.querySelector(".p-flag");
    if (flag) card.when = txt(flag);

    /* skills rows are a term/definition pair, not a titled entry */
    if (n.classList.contains("skillrow")){
      card.title = txt(n.querySelector("dt"));
      card.meta = "";
      card.when = "";
      card.body.push(txt(n.querySelector("dd")));
    }

    var kind = n.querySelector(".p-kind");
    if (kind && card.meta !== txt(kind)) card.body.unshift(txt(kind));

    var lis = n.querySelectorAll("ul.bul li");
    for (j = 0; j < lis.length; j++) card.body.push(txt(lis[j]));

    var year = n.querySelector(".ach-year .label");
    if (year && !card.when) card.when = txt(year);
    if (year && card.when && card.when !== txt(year)) card.meta = txt(year) + (card.meta ? "  " + card.meta : "");

    var tags = n.querySelectorAll(".stack span");
    for (j = 0; j < tags.length; j++) card.tags.push(txt(tags[j]));

    var as = n.querySelectorAll("a[href]");
    for (j = 0; j < as.length; j++){
      var href = as[j].getAttribute("href");
      if (!href || href.charAt(0) === "#") continue;
      card.links.push({ label: txt(as[j]).replace(/\s*\u25b6\s*$/,"").replace(/\s*→\s*$/,""), href: as[j].href });
    }

    if (card.title || card.body.length) cards.push(card);
  }

  /* contact has no entries; build one card from the links */
  if (!cards.length){
    var c2 = { title:txt(sec.querySelector(".h2")), meta:"", when:"", body:[], tags:[], links:[] };
    var big = sec.querySelector(".contact-big");
    if (big) c2.body.push(txt(big));
    var la = sec.querySelectorAll("a[href]");
    for (i = 0; i < la.length; i++){
      var h = la[i].getAttribute("href");
      if (!h || h.charAt(0) === "#") continue;
      c2.links.push({ label:txt(la[i]), href:la[i].href });
    }
    cards.push(c2);
  }
  return cards;
}

var SECTIONS = [];
function harvest(){
  SECTIONS.length = 0;
  var mail = src.querySelector('a[href^="mailto:"]');
  MAILTO = mail ? mail.href : "";
  for (var i = 0; i < SECTION_IDS.length; i++){
    var sec = src.getElementById(SECTION_IDS[i]);
    if (!sec) continue;
    var lead = txt(sec.querySelector(".sec-lead"));
    var cards = harvestCards(sec);
    if (lead) cards.unshift({ intro:true, title:"", meta:"", when:"", body:[lead], tags:[], links:[] });
    SECTIONS.push({
      id: SECTION_IDS[i],
      no: ("0" + (SECTIONS.length + 1)).slice(-2),
      name: txt(sec.querySelector(".h2")),
      lead: lead,
      cards: cards,
      seen: false
    });
  }
}

/* ---------------------------------------------------------------
   4. WORLD
   --------------------------------------------------------------- */
var SPACING = 560, FIRST = 420, GROUND = 126;
var LEVEL = FIRST + SPACING * 8 + 340;
var STATIONS = [];

function layout(){
  LEVEL = FIRST + SPACING * (SECTIONS.length - 1) + 340;
  STATIONS = SECTIONS.map(function(s, i){
    return { sec:s, x: FIRST + i * SPACING, real:true };
  });
  layoutExtras();
}

/* deterministic noise so scenery never flickers between frames */
function rnd(i){
  var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function nearestStationDist(x){
  var d = 1e9;
  for (var i = 0; i < STATIONS.length; i++) d = Math.min(d, Math.abs(x - STATIONS[i].x));
  return d;
}

function terrain(x){
  if (x < 0) x = 0;
  if (x > LEVEL) x = LEVEL;
  var wave = Math.sin(x * 0.0037) * 7 + Math.sin(x * 0.0111 + 1.3) * 3;
  var f = Math.min(1, Math.max(0, (nearestStationDist(x) - 58) / 70));
  return GROUND - wave * f;
}

/* ---------------------------------------------------------------
   5. VEHICLES
   --------------------------------------------------------------- */
var VEHICLES = [
  { id:"foot", name:"On foot",  hint:"Space to jump",        accel:0.30, max:1.15, fric:0.72, jump:3.30, grav:0.24, fly:false },
  { id:"bike", name:"Bicycle",  hint:"Space to hop",         accel:0.09, max:2.30, fric:0.975,jump:2.60, grav:0.24, fly:false },
  { id:"pogo", name:"Pogo",     hint:"Bounces on its own",   accel:0.14, max:1.55, fric:0.94, jump:0,    grav:0.20, fly:false, bounce:3.70 },
  { id:"kart", name:"Kart",     hint:"Fast, no jump",        accel:0.11, max:3.40, fric:0.988,jump:1.40, grav:0.30, fly:false },
  { id:"jet",  name:"Jetpack",  hint:"Hold space to climb",  accel:0.13, max:2.50, fric:0.955,jump:0,    grav:0.13, fly:true, thrust:0.34 }
];

var P = {
  x: FIRST, y: GROUND, vx:0, vy:0,
  face: 1, onGround:true, veh:0, anim:0, bounce:0
};

var camX = 0, camY = 0;

/* ---------------------------------------------------------------
   6. DRAW HELPERS
   --------------------------------------------------------------- */
/* Transitions. Rather than touching every mode = "..." site, the loop
   notices the mode changed and runs a short blind-wipe over the top.
   bootT gives the intro a CRT coming on. */
var wipe = 0, lastMode = "", bootT = 0;
function drawWipe(dt){
  if (wipe <= 0) return;
  wipe -= dt;
  var band = Math.ceil(Math.max(0, wipe / 9) * 8);
  if (band <= 0) return;
  for (var y = 0; y < H; y += 8) sr(0, y, W, band, C.black);
}
function drawBoot(dt){
  if (bootT <= 0) return;
  bootT -= dt;
  var t = Math.max(0, bootT / 26);
  var h = Math.round((1 - t) * (H / 2));
  sr(0, 0, W, H / 2 - h, C.black);
  sr(0, H / 2 + h, W, H / 2 - h + 1, C.black);
  if (h < H / 2){
    sr(0, H / 2 - h - 1, W, 1, C.paper);
    sr(0, H / 2 + h, W, 1, C.paper);
  }
}

/* Particles. One flat array, world coordinates, drawn through wr() so
   they shake and scroll with everything else. Capped, because a pixel
   at a time is cheap but not free. */
var parts = [], PART_MAX = 130;
function spawn(x, y, n, col, kind){
  if (reduceMotion) return;
  for (var i = 0; i < n && parts.length < PART_MAX; i++){
    var a = Math.random() * Math.PI * 2, sp = Math.random();
    parts.push({
      x:x, y:y,
      vx: kind === "dust" ? (Math.random() * 2 - 1) * 0.8 : Math.cos(a) * sp * 1.4,
      vy: kind === "dust" ? -Math.random() * 0.5 : (kind === "jet" ? Math.random() * 1.2 + 0.3 : Math.sin(a) * sp * 1.4),
      g:  kind === "jet" ? 0.01 : 0.06,
      t:  14 + Math.random() * 14,
      col: col
    });
  }
}
function stepParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){
    var q = parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt;
    q.t -= dt;
    if (q.t <= 0) parts.splice(i, 1);
  }
}
function drawParts(){
  for (var i = 0; i < parts.length; i++){
    var q = parts[i];
    if (q.x - camX < -8 || q.x - camX > W + 8) continue;
    wr(q.x, q.y, q.t > 8 ? 2 : 1, q.t > 8 ? 2 : 1, q.col);
  }
}

/* Screen shake. Every world pixel goes through wr(), so folding the
   offset in here is the whole feature - nothing else has to know. */
var shakeMag = 0, shakeX = 0, shakeY = 0;
function shake(m){
  if (reduceMotion) return;
  shakeMag = Math.min(5, Math.max(shakeMag, m));
}
function stepShake(dt){
  if (shakeMag <= 0.05){ shakeMag = 0; shakeX = 0; shakeY = 0; return; }
  shakeX = (Math.random() * 2 - 1) * shakeMag;
  shakeY = (Math.random() * 2 - 1) * shakeMag;
  shakeMag *= Math.pow(0.82, dt);
}

function wr(x, y, w, h, col){
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x - camX + shakeX), Math.round(y - camY + shakeY), w, h);
}
function sr(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w, h); }

function hex(h){ return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
function mix(a, b, t){
  var A = hex(a), B = hex(b), o = "#", i, v;
  for (i = 0; i < 3; i++){
    v = Math.round(A[i] + (B[i] - A[i]) * t);
    o += ("0" + v.toString(16)).slice(-2);
  }
  return o;
}

function wheel(cx, cy, r, col, rim, spin){
  for (var dy = -r; dy <= r; dy++){
    var dx = Math.floor(Math.sqrt(Math.max(0, r*r - dy*dy)));
    wr(cx - dx, cy + dy, dx * 2 + 1, 1, col);
  }
  if (rim){
    var a = spin, ox = Math.round(Math.cos(a) * (r - 2)), oy = Math.round(Math.sin(a) * (r - 2));
    wr(cx + ox, cy + oy, 1, 1, rim);
    wr(cx - ox, cy - oy, 1, 1, rim);
  }
}

/* ---------------------------------------------------------------
   7. SKY, PARALLAX, GROUND
   --------------------------------------------------------------- */
function skyPair(t){
  var top, bot;
  if (t < 0.5){ var u = t / 0.5; top = mix(C.sky, C.deep, u); bot = mix(C.cyan, C.gold, u); }
  else { var v = (t - 0.5) / 0.5; top = mix(C.deep, C.night, v); bot = mix(C.gold, C.slate, v); }
  return [top, bot];
}

function drawSky(t){
  var pair = skyPair(t), bands = 10, i;
  for (i = 0; i < bands; i++){
    sr(0, Math.round(i * H / bands), W, Math.ceil(H / bands) + 1, mix(pair[0], pair[1], i / (bands - 1)));
  }
  /* stars once the run turns towards night */
  if (t > 0.52){
    var a = Math.min(1, (t - 0.52) / 0.3);
    for (i = 0; i < 40; i++){
      var sx = (rnd(i) * (LEVEL + 400) - camX * 0.12) % (W + 40);
      if (sx < 0) sx += W + 40;
      var sy = 4 + rnd(i + 90) * 70;
      var tw = reduceMotion ? 1 : (0.6 + 0.4 * Math.sin(now / 400 + i));
      if (a * tw > 0.45) sr(sx - 20, sy, 1, 1, mix(C.haze, C.paper, a * tw));
    }
  }
  /* sun or moon, parked low over the horizon */
  var hx = ((196 - camX * 0.03) % 320 + 320) % 320 - 40;
  var hy = 34;
  var disc = t < 0.5 ? mix(C.paper, C.gold, t * 2) : mix(C.gold, C.mist, (t - 0.5) * 2);
  for (var dy = -8; dy <= 8; dy++){
    var dx = Math.floor(Math.sqrt(Math.max(0, 64 - dy*dy)));
    sr(hx - dx, hy + dy, dx * 2 + 1, 1, disc);
  }
}

function drawClouds(t){
  var drift = reduceMotion ? 0 : now * 0.004;
  for (var i = 0; i < 14; i++){
    var base = rnd(i) * (LEVEL + 600);
    var cx = base - camX * 0.14 - drift;
    cx = ((cx % (LEVEL + 600)) + LEVEL + 600) % (LEVEL + 600);
    if (cx < -60 || cx > W + 20) continue;
    var cy = 12 + rnd(i + 5) * 40 - camY * 0.14;
    var w = 16 + Math.floor(rnd(i + 11) * 20);
    var col = mix(C.paper, C.mist, 0.25 + t * 0.5);
    sr(cx, cy, w, 3, col);
    sr(cx + 4, cy - 3, w - 10, 3, col);
    sr(cx + 2, cy + 3, w - 4, 2, mix(col, C.slate, 0.25));
  }
}

function drawHills(t){
  var farCol = mix(mix(skyPair(t)[1], C.slate, 0.62), C.ink, 0.14);
  var midCol = mix(farCol, C.ink, 0.45);
  var sx, wx, y;
  for (sx = 0; sx < W; sx++){
    wx = camX * 0.28 + sx;
    y = 92 - Math.sin(wx * 0.006) * 12 - Math.sin(wx * 0.017 + 2) * 5 - camY * 0.28;
    sr(sx, y, 1, H - y, farCol);
  }
  for (sx = 0; sx < W; sx++){
    wx = camX * 0.52 + sx;
    y = 104 - Math.sin(wx * 0.009 + 1.1) * 9 - Math.sin(wx * 0.023) * 4 - camY * 0.5;
    sr(sx, y, 1, H - y, midCol);
  }
}

/* a low skyline of workplaces behind the mid hills */
function drawSkyline(t){
  var col = mix(C.ink, C.shadow, 0.5);
  var lit = mix(C.gold, C.paper, 0.2 - t * 0.2);
  for (var i = 0; i < 60; i++){
    var bx = i * 90 + rnd(i) * 40 - camX * 0.52;
    if (bx < -60 || bx > W + 10) continue;
    var bw = 18 + Math.floor(rnd(i + 3) * 22);
    var bh = 22 + Math.floor(rnd(i + 7) * 34);
    var by = 116 - bh - camY * 0.5;
    sr(bx, by, bw, bh + 20, col);
    for (var wy = by + 4; wy < by + bh - 3; wy += 6){
      for (var wx2 = bx + 3; wx2 < bx + bw - 3; wx2 += 5){
        var on = rnd(wx2 * 3 + wy) > (0.72 - t * 0.35);
        sr(wx2, wy, 2, 3, on ? lit : mix(col, C.black, 0.4));
      }
    }
  }
}

function drawGround(t){
  var grass = mix(C.moss, C.slate, 0.25 + t * 0.5);
  var lip   = mix(grass, C.black, 0.45);
  var soil  = mix(C.rust, C.ink, 0.45 + t * 0.2);
  var soil2 = mix(soil, C.black, 0.45);
  var deep  = mix(C.ink, C.black, 0.55);
  for (var sx = 0; sx < W; sx++){
    var wx = camX + sx, gy = Math.round(terrain(wx) - camY);
    sr(sx, gy, 1, 2, grass);
    sr(sx, gy + 2, 1, 1, lip);
    sr(sx, gy + 3, 1, 6, soil);
    sr(sx, gy + 9, 1, 5, soil2);
    sr(sx, gy + 14, 1, H - gy - 14, deep);
    var k = (wx * 7919) & 31;
    if (k < 3) sr(sx, gy + 4 + k, 1, 1, mix(soil, C.grey, 0.45));
    if (k > 27) sr(sx, gy + 12 + (k & 5), 1, 2, mix(soil2, C.grey, 0.25));
  }
}

/* fence posts, tufts and lamps along the path */
function drawProps(t){
  for (var i = 0; i < 220; i++){
    var x = i * 41 + rnd(i) * 30;
    if (x - camX < -20 || x - camX > W + 20) continue;
    if (nearestStationDist(x) < 62) continue;
    var g = terrain(x), kind = Math.floor(rnd(i + 21) * 3);
    if (kind === 0){
      wr(x, g - 5, 1, 5, mix(C.moss, C.ink, 0.3 + t * 0.4));
      wr(x - 2, g - 6, 5, 1, mix(C.moss, C.ink, 0.2 + t * 0.4));
    } else if (kind === 1){
      wr(x, g - 9, 2, 9, mix(C.rust, C.ink, 0.35));
      wr(x - 2, g - 11, 6, 2, mix(C.rust, C.ink, 0.15));
    } else {
      wr(x, g - 18, 2, 18, C.slate);
      wr(x - 2, g - 21, 6, 4, C.grey);
      wr(x - 1, g - 20, 4, 2, t > 0.4 ? C.gold : mix(C.gold, C.paper, 0.6));
    }
  }
}

/* ---------------------------------------------------------------
   8. STATION MONUMENTS  — one silhouette per section
   --------------------------------------------------------------- */
function monument(id, x, g, near){
  var body = C.slate, dark = C.ink, trim = C.mist, hot = near ? C.gold : C.haze;
  switch(id){
    case "experience":               /* an office block, lights on */
      wr(x - 16, g - 44, 32, 44, body);
      wr(x - 16, g - 46, 32, 3, dark);
      for (var wy = g - 40; wy < g - 6; wy += 7)
        for (var wx = x - 12; wx < x + 10; wx += 7)
          wr(wx, wy, 4, 4, rnd(wx * wy) > 0.4 ? C.gold : dark);
      wr(x - 5, g - 10, 10, 10, dark);
      break;

    case "projects":                 /* a server rack, one LED alive */
      wr(x - 14, g - 40, 28, 40, dark);
      for (var ry = g - 37; ry < g - 3; ry += 6){
        wr(x - 11, ry, 22, 4, body);
        wr(x + 7, ry + 1, 2, 2, (Math.floor(now / 300 + ry) % 3) ? C.moss : C.red);
      }
      wr(x - 16, g - 43, 32, 4, body);
      break;

    case "games":                    /* an arcade cabinet */
      wr(x - 13, g - 42, 26, 42, body);
      wr(x - 13, g - 44, 26, 4, C.red);
      wr(x - 10, g - 38, 20, 14, C.night);
      wr(x - 8, g - 34, 4, 4, C.cyan);
      wr(x + 2, g - 30, 4, 4, C.gold);
      wr(x - 10, g - 20, 20, 5, dark);
      wr(x - 6, g - 19, 3, 3, C.red);
      wr(x + 3, g - 19, 3, 3, C.moss);
      break;

    case "design":                   /* an easel with a wet canvas */
      wr(x - 14, g - 34, 28, 24, C.paper);
      wr(x - 14, g - 36, 28, 3, C.rust);
      wr(x - 10, g - 30, 9, 9, C.red);
      wr(x + 1, g - 26, 10, 5, C.cyan);
      wr(x - 8, g - 18, 16, 4, C.gold);
      wr(x - 8, g - 10, 3, 10, C.rust);
      wr(x + 5, g - 10, 3, 10, C.rust);
      break;

    case "achievements":             /* a podium and a cup */
      wr(x - 18, g - 10, 12, 10, body);
      wr(x - 5, g - 16, 12, 16, trim);
      wr(x + 8, g - 7, 11, 7, body);
      wr(x - 4, g - 30, 10, 9, C.gold);
      wr(x - 7, g - 28, 3, 4, C.gold);
      wr(x + 5, g - 28, 3, 4, C.gold);
      wr(x - 2, g - 21, 6, 3, C.gold);
      wr(x - 5, g - 18, 12, 2, C.rust);
      break;

    case "open-source":              /* a tree shaped like a branch graph */
      wr(x - 2, g - 26, 4, 26, C.rust);
      wr(x - 12, g - 34, 24, 10, C.moss);
      wr(x - 8, g - 40, 16, 8, C.moss);
      wr(x - 14, g - 30, 6, 5, C.moss);
      wr(x + 8, g - 30, 6, 5, C.moss);
      wr(x - 10, g - 22, 8, 2, C.rust);
      wr(x + 2, g - 17, 8, 2, C.rust);
      break;

    case "skills":                   /* a workbench with tools on a board */
      wr(x - 18, g - 12, 36, 4, C.rust);
      wr(x - 16, g - 8, 3, 8, C.rust);
      wr(x + 13, g - 8, 3, 8, C.rust);
      wr(x - 16, g - 38, 32, 26, body);
      wr(x - 12, g - 34, 3, 12, trim);
      wr(x - 6, g - 34, 7, 7, C.gold);
      wr(x - 4, g - 27, 3, 6, trim);
      wr(x + 4, g - 33, 9, 3, C.cyan);
      wr(x + 6, g - 26, 5, 5, C.red);
      break;

    case "education":                /* a small school with a bell */
      wr(x - 17, g - 26, 34, 26, body);
      for (var ex = x - 13; ex < x + 11; ex += 9) wr(ex, g - 22, 6, 7, C.cyan);
      wr(x - 4, g - 12, 8, 12, C.rust);
      for (var t2 = 0; t2 < 10; t2++) wr(x - 17 - 2 + t2 * 2, g - 28 - t2, 38 - t2 * 4 + 4, 2, dark);
      wr(x - 2, g - 42, 4, 6, C.gold);
      break;

    case "secret":                   /* a bench and a fire, nobody around */
      wr(x - 15, g - 11, 22, 3, C.rust);
      wr(x - 14, g - 8, 2, 8, C.rust);
      wr(x + 4, g - 8, 2, 8, C.rust);
      wr(x - 15, g - 18, 22, 2, C.rust);
      wr(x + 13, g - 4, 12, 4, C.ink);
      wr(x + 16, g - 9, 2, 5, near ? C.gold : C.rust);
      wr(x + 19, g - 12, 2, 8, near ? C.red : C.rust);
      wr(x + 22, g - 8, 2, 4, near ? C.gold : C.rust);
      break;

    default:                         /* contact: a booth with an aerial */
      wr(x - 11, g - 32, 22, 32, C.red);
      wr(x - 8, g - 28, 16, 16, C.night);
      wr(x - 8, g - 28, 16, 3, C.cyan);
      wr(x - 13, g - 35, 26, 4, C.rust);
      wr(x - 1, g - 46, 2, 12, C.slate);
      wr(x - 5, g - 50, 10, 2, C.slate);
      wr(x - 1, g - 53, 2, 3, near ? C.gold : C.grey);
      break;
  }

  /* the marker post: number, name, and a nudge when you are close */
  wr(x + 20, g - 26, 2, 26, C.grey);
  wr(x + 14, g - 34, 22, 10, hot);
  return hot;
}

function drawStations(t){
  for (var i = 0; i < STATIONS.length; i++){
    var s = STATIONS[i], x = s.x;
    if (x - camX < -70 || x - camX > W + 70) continue;
    var g = Math.round(terrain(x));
    var near = Math.abs(P.x - x) < 42;
    var hot = monument(s.sec.id, x, g, near);

    /* plaque number sits on the post, name floats above the monument */
    text(s.sec.no, Math.round(x + 19 - camX), Math.round(g - 32 - camY), C.ink);
    var nm = s.sec.name.toUpperCase();
    var nx = Math.round(x - textWidth(nm) / 2 - camX);
    var ny = Math.round(g - 60 - camY);
    sr(nx - 3, ny - 2, textWidth(nm) + 6, 11, near ? C.ink : mix(C.ink, C.black, 0.4));
    text(nm, nx, ny, near ? C.gold : C.haze);
    if (s.sec.seen) text("\u2713", nx + textWidth(nm) + 4, ny, C.moss);

    if (near){
      var bob = reduceMotion ? 0 : Math.round(Math.sin(now / 220) * 1.5);
      text("\u25bc", Math.round(x - 3 - camX), Math.round(g - 50 - camY + bob), C.gold);
    }
  }
}

/* start and finish markers */
function drawEnds(){
  var g0 = Math.round(terrain(40));
  wr(40, g0 - 30, 2, 30, C.grey);
  wr(42, g0 - 30, textWidth("START") + 6, 12, C.paper);
  text("START", 45 - camX, g0 - 27 - camY, C.ink);
  var gl = Math.round(terrain(LEVEL - 120));
  for (var i = 0; i < 6; i++)
    for (var j = 0; j < 3; j++)
      wr(LEVEL - 126 + i * 4, gl - 40 + j * 4, 4, 4, ((i + j) & 1) ? C.paper : C.ink);
  wr(LEVEL - 128, gl - 40, 2, 40, C.grey);
}

/* ---------------------------------------------------------------
   9. THE RIDER
   --------------------------------------------------------------- */
function drawRider(x, y, f, walkT, moving){
  var swing = moving ? Math.sin(walkT) * 3 : 0;
  wr(x - 3, y - 21, 7, 3, C.gold);            /* cap */
  wr(x - 3 + f * 2, y - 20, 3, 1, C.gold);    /* brim */
  wr(x - 2, y - 18, 5, 4, C.mist);            /* face */
  wr(x + (f > 0 ? 1 : -1), y - 17, 1, 1, C.ink);
  wr(x - 3, y - 14, 7, 7, C.deep);            /* jacket */
  wr(x - 3, y - 13, 7, 1, C.sky);
  wr(x + (f > 0 ? 3 : -4), y - 13, 1, 5, C.deep);
  return swing;
}

function drawPlayer(){
  var v = VEHICLES[P.veh], x = Math.round(P.x - camX), y = Math.round(P.y - camY), f = P.face;
  var moving = Math.abs(P.vx) > 0.15;
  var walkT = P.anim;

  ctx.save();
  /* soft contact shadow */
  ctx.fillStyle = "rgba(10,9,16,.35)";
  var sh = P.onGround ? 9 : 6;
  ctx.fillRect(x - sh / 2, Math.round(terrain(P.x) - camY) - 1, sh, 2);

  if (v.id === "foot"){
    var bob = moving && !reduceMotion ? Math.round(Math.sin(walkT * 2) * 0.6) : 0;
    var yy = y + bob;
    sr(x - 3, yy - 21, 7, 3, C.gold);
    sr(x - 3 + (f > 0 ? 4 : -2), yy - 20, 3, 1, C.gold);
    sr(x - 2, yy - 18, 5, 4, C.mist);
    sr(x + (f > 0 ? 1 : -2), yy - 17, 1, 1, C.ink);
    sr(x - 3, yy - 14, 7, 7, C.deep);
    sr(x - 3, yy - 13, 7, 1, C.sky);
    var sw = moving ? Math.sin(walkT) * 2.5 : 0;
    sr(x - 3 + (f > 0 ? 6 : -2), yy - 13 + (sw | 0), 2, 5, C.mist);      /* arm */
    if (P.onGround){
      sr(x - 3 + Math.round(2 + sw), yy - 7, 2, 7, C.ink);
      sr(x - 3 + Math.round(2 - sw), yy - 7, 2, 7, C.shadow);
    } else {
      sr(x - 2, yy - 7, 2, 6, C.ink);
      sr(x + 1, yy - 7, 2, 5, C.shadow);
    }
  }

  else if (v.id === "bike"){
    var spin = P.anim * 1.4;
    wheel(x - 6, y - 4, 4, C.ink, C.mist, spin);
    wheel(x + 6, y - 4, 4, C.ink, C.mist, spin);
    sr(x - 6, y - 9, 12, 2, C.red);
    sr(x - 1, y - 13, 2, 5, C.red);
    sr(x + 5, y - 12, 2, 8, C.red);
    sr(x + 4, y - 14, 5, 2, C.slate);
    sr(x - 3, y - 21, 7, 3, C.gold);
    sr(x - 2, y - 18, 5, 4, C.mist);
    sr(x + (f > 0 ? 1 : -2), y - 17, 1, 1, C.ink);
    sr(x - 3, y - 14, 7, 6, C.deep);
    sr(x + 2, y - 13, 5, 2, C.mist);
    sr(x - 2, y - 9, 3, 4, C.ink);
  }

  else if (v.id === "pogo"){
    var sq = Math.max(0, Math.min(6, P.bounce));
    var stick = 10 - sq;
    sr(x - 1, y - stick, 2, stick, C.slate);
    sr(x - 4, y - 2, 8, 2, C.rust);
    sr(x - 5, y - stick - 4, 10, 3, C.slate);
    var yy = y - stick - 4;
    sr(x - 3, yy - 18, 7, 3, C.gold);
    sr(x - 2, yy - 15, 5, 4, C.mist);
    sr(x + (f > 0 ? 1 : -2), yy - 14, 1, 1, C.ink);
    sr(x - 3, yy - 11, 7, 7, C.moss);
    sr(x - 4, yy - 10, 2, 5, C.mist);
    sr(x + 3, yy - 10, 2, 5, C.mist);
    sr(x - 2, yy - 4, 2, 4, C.ink);
    sr(x + 1, yy - 4, 2, 4, C.ink);
  }

  else if (v.id === "kart"){
    var sp2 = P.anim * 2.2;
    wheel(x - 8, y - 3, 3, C.ink, C.grey, sp2);
    wheel(x + 8, y - 3, 3, C.ink, C.grey, sp2);
    sr(x - 12, y - 9, 24, 5, C.red);
    sr(x - 12, y - 10, 24, 1, C.gold);
    sr(x + (f > 0 ? 8 : -12), y - 12, 4, 3, C.mist);   /* nose cone */
    sr(x - 6, y - 14, 9, 5, C.rust);
    sr(x - 3, y - 20, 7, 3, C.gold);
    sr(x - 2, y - 17, 5, 4, C.mist);
    sr(x + (f > 0 ? 1 : -2), y - 16, 1, 1, C.ink);
    sr(x - 4, y - 13, 3, 3, C.slate);
    if (Math.abs(P.vx) > 2 && !reduceMotion){
      var pf = Math.round(rnd(Math.floor(now / 60)) * 3);
      sr(x - 14 - pf, y - 6, 3, 2, C.haze);
      sr(x - 18 - pf, y - 5, 2, 2, C.mist);
    }
  }

  else {  /* jetpack */
    var lift = keys.up || keys.a;
    sr(x - 6, y - 18, 4, 9, C.slate);          /* tank */
    sr(x - 6, y - 19, 4, 1, C.red);
    sr(x - 3, y - 21, 7, 3, C.gold);
    sr(x - 2, y - 18, 5, 4, C.mist);
    sr(x + (f > 0 ? 1 : -2), y - 17, 1, 1, C.ink);
    sr(x - 3, y - 14, 7, 7, C.deep);
    sr(x - 3, y - 13, 7, 1, C.cyan);
    sr(x - 2, y - 7, 2, 5, C.ink);
    sr(x + 1, y - 7, 2, 5, C.shadow);
    if (lift){
      var fl = reduceMotion ? 3 : 3 + Math.round(rnd(Math.floor(now / 50)) * 4);
      sr(x - 6, y - 9, 4, fl, C.gold);
      sr(x - 5, y - 9 + fl, 2, 2, C.red);
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------
   9b. SOUND
   Oscillators only. There is no audio file here either, for the
   same reason there is no image file. The context is built on the
   first key or tap, because a browser will not let a page make a
   noise before it has been touched.
   --------------------------------------------------------------- */
function getPref(k, d){
  try { var v = window.localStorage.getItem("arcade." + k); return v === null ? d : v; }
  catch(e){ return d; }
}
function setPref(k, v){
  try { window.localStorage.setItem("arcade." + k, String(v)); } catch(e){}
}

var actx = null, master = null, drone = null, droneGain = null, droneFilt = null;
var muted = getPref("mute", "0") === "1";
var btnSnd = doc.getElementById("pb-snd");

/* name: [wave, from, to, seconds, volume] */
var SFX = {
  jump:  ["square",   220, 660, 0.12, 0.20],
  hop:   ["square",   300, 700, 0.09, 0.16],
  land:  ["triangle", 190,  80, 0.08, 0.18],
  pick:  ["square",   660,1320, 0.16, 0.20],
  card:  ["square",   440, 880, 0.06, 0.14],
  close: ["square",   880, 440, 0.06, 0.12],
  menu:  ["square",   520, 520, 0.04, 0.10],
  ride:  ["square",   330, 550, 0.10, 0.16],
  hit:   ["sawtooth", 300,  80, 0.14, 0.20],
  die:   ["square",   400,  60, 0.45, 0.22],
  point: ["square",   880,1180, 0.07, 0.16]
};

function ensureAudio(){
  if (actx || muted) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch(e){ actx = null; return; }
  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);
}

function sfx(name, vol){
  if (muted) return;
  ensureAudio();
  if (!actx || !SFX[name]) return;
  if (actx.state === "suspended") actx.resume();
  var s = SFX[name], t = actx.currentTime;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = s[0];
  o.frequency.setValueAtTime(s[1], t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, s[2]), t + s[3]);
  g.gain.setValueAtTime(s[4] * (vol === undefined ? 1 : vol), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + s[3]);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + s[3] + 0.02);
}

/* a short run of notes, for the flag and the last floppy */
function fanfare(notes){
  if (muted) return;
  ensureAudio();
  if (!actx) return;
  if (actx.state === "suspended") actx.resume();
  for (var i = 0; i < notes.length; i++){
    var t = actx.currentTime + i * 0.11;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(notes[i], t);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
  }
}

/* the engine under the bike, the kart and the jetpack */
function engine(speed, id){
  if (muted || !actx) return;
  var want = (id === "kart" || id === "bike" || id === "jet") ? Math.min(1, speed) : 0;
  if (!drone){
    drone = actx.createOscillator();
    droneFilt = actx.createBiquadFilter();
    droneGain = actx.createGain();
    drone.type = "sawtooth";
    droneFilt.type = "lowpass";
    droneFilt.frequency.value = 900;
    droneGain.gain.value = 0;
    drone.connect(droneFilt); droneFilt.connect(droneGain); droneGain.connect(master);
    drone.start();
  }
  var base = id === "jet" ? 90 : (id === "kart" ? 60 : 110);
  var t = actx.currentTime;
  drone.frequency.setTargetAtTime(base + want * (id === "jet" ? 130 : 90), t, 0.08);
  droneGain.gain.setTargetAtTime(want * (id === "jet" ? 0.10 : 0.07), t, 0.08);
}

function setMuted(m){
  muted = m;
  setPref("mute", m ? "1" : "0");
  if (m && droneGain && actx) droneGain.gain.setTargetAtTime(0, actx.currentTime, 0.05);
  if (btnSnd){
    btnSnd.textContent = m ? "Sound" : "Mute";
    btnSnd.setAttribute("aria-pressed", m ? "true" : "false");
  }
}
if (btnSnd){
  setMuted(muted);
  btnSnd.addEventListener("click", function(){ setMuted(!muted); if (!muted) sfx("menu"); cv.focus(); });
}

/* ---------------------------------------------------------------
   11. CARD BUILDING
   --------------------------------------------------------------- */
var COLS = 37, BODY_X = 8;

function buildCard(si, ci){
  var sec = STATIONS[si].sec;
  ci = Math.max(0, Math.min(sec.cards.length - 1, ci));
  var c = sec.cards[ci], lines = [], i, j, w;

  function push(s, col, ind){ lines.push({ s:s, col:col, ind:ind || 0 }); }

  for (i = 0; i < c.body.length; i++){
    if (c.intro){                       /* a section opener reads as a paragraph */
      w = wrap(c.body[i], COLS);
      for (j = 0; j < w.length; j++) push(w[j], C.mist);
    } else {
      w = wrap(c.body[i], COLS - 2);
      for (j = 0; j < w.length; j++) push((j ? "  " : "- ") + w[j], C.mist);
    }
  }
  if (c.tags.length){
    push("", C.mist);
    w = wrap("Built with: " + c.tags.join(", "), COLS);
    for (j = 0; j < w.length; j++) push(w[j], C.cyan);
  }
  if (c.links.length){
    push("", C.mist);
    for (i = 0; i < c.links.length && i < 4; i++){
      push("[" + (i + 1) + "] " + c.links[i].label, C.gold);
      lines[lines.length - 1].link = i;
    }
  }

  var titleLines = c.intro ? [] : wrap(c.title || sec.name, COLS);
  var metaLine = [c.when, c.meta].filter(Boolean).join("  \u00b7  ");
  var metaLines = [];
  if (metaLine){
    var mw = wrap(metaLine, COLS);
    metaLines = mw.slice(0, 2);
    if (mw.length > 2) metaLines[1] = metaLines[1].slice(0, COLS - 3) + "...";
  }
  var top = 20 + titleLines.length * LINE_H + (metaLines.length ? metaLines.length * LINE_H + 3 : 2);
  var perPage = Math.max(4, Math.floor((138 - top) / LINE_H));

  var pages = [];
  for (i = 0; i < lines.length; i += perPage) pages.push(lines.slice(i, i + perPage));
  if (!pages.length) pages.push([]);

  sec.seen = true;
  var sparse = !lines.length && !c.intro;
  card = {
    sparse:sparse,
    si:si, ci:ci, sec:sec, c:c, page:0, pages:pages,
    titleLines:titleLines, metaLines:metaLines, top:top, hits:[]
  };
}

function openStation(si){
  if (si < 0) return;
  buildCard(si, 0);
  mode = "card";
  syncPad();
  sfx("card");
}

function cardMove(d){
  var n = card.ci + d;
  if (n < 0 || n >= card.sec.cards.length) return;
  buildCard(card.si, n);
}

function openLink(i){
  if (!card || !card.c.links[i]) return;
  var href = card.c.links[i].href;
  if (href.indexOf("mailto:") === 0) window.location.href = href;
  else window.open(href, "_blank", "noopener");
}

/* ---------------------------------------------------------------
   12. UPDATE
   --------------------------------------------------------------- */
function step(dt){
  var v = VEHICLES[P.veh];
  var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  if (dir){ P.vx += dir * v.accel * dt; P.face = dir; }
  else P.vx *= Math.pow(v.fric, dt);
  if (P.vx >  v.max) P.vx =  v.max;
  if (P.vx < -v.max) P.vx = -v.max;
  if (Math.abs(P.vx) < 0.02) P.vx = 0;

  if (v.fly && keys.a) P.vy -= v.thrust * dt;
  P.vy += v.grav * dt;
  if (P.vy >  4) P.vy = 4;
  if (P.vy < -3) P.vy = -3;

  var y0 = P.y;
  P.x += P.vx * dt;
  P.y += P.vy * dt;

  if (P.x < 24) { P.x = 24; P.vx = 0; }
  if (P.x > LEVEL - 18) { P.x = LEVEL - 18; P.vx = 0; }
  if (P.y < 26) { P.y = 26; P.vy = 0; }

  /* ledges catch you from above only, so nothing can trap you under one */
  var wasAir = !P.onGround, impact = P.vy;
  var landed = false;
  if (P.vy >= 0){
    for (var pi = 0; pi < PLATFORMS.length; pi++){
      var pf = PLATFORMS[pi];
      if (P.x > pf.x - 3 && P.x < pf.x + pf.w + 3 && y0 <= pf.y + 2 && P.y >= pf.y){
        P.y = pf.y;
        landed = true;
        if (v.bounce && !keys.down) { P.vy = -v.bounce; P.bounce = 6; }
        else P.vy = 0;
        break;
      }
    }
  }

  var g = terrain(P.x);
  if (landed){
    P.onGround = true;
  } else if (P.y >= g){
    P.y = g;
    P.onGround = true;
    if (v.bounce && !keys.down) { P.vy = -v.bounce; P.bounce = 6; }
    else P.vy = 0;
  } else {
    P.onGround = false;
  }

  if (P.onGround && wasAir && impact > 0.6){
    sfx(v.bounce ? "hop" : "land", Math.min(1, impact / 3.2));
    if (impact > 2.2) shake(Math.min(3, (impact - 2.2) * 1.6));
    spawn(P.x, P.y - 1, impact > 2.2 ? 8 : 4, C.grey, "dust");
  }
  /* the kart rattles once it is really moving */
  if (v.id === "kart" && Math.abs(P.vx) > v.max * 0.88 && P.onGround){
    shake(0.5);
    if (Math.random() < 0.4) spawn(P.x - P.face * 6, P.y - 2, 1, C.gold, "dust");
  }
  if (v.fly && keys.a && Math.random() < 0.7) spawn(P.x, P.y - 4, 1, C.rust, "jet");
  engine(Math.abs(P.vx) / Math.max(0.01, v.max), v.id);

  grabDisks();
  if (!endShown && P.x > FLAG_X - 8){
    endShown = true; mode = "end"; syncPad();
    shake(2.5);
    fanfare([523, 659, 784, 1047]);
  }
  if (konami && !reduceMotion && Math.abs(P.vx) > 0.2){
    trail.push({ x:P.x, y:P.y - 10, t:26 });
    if (trail.length > 70) trail.shift();
  }
  for (var ti = trail.length - 1; ti >= 0; ti--){
    trail[ti].t -= dt;
    if (trail[ti].t <= 0) trail.splice(ti, 1);
  }
  if (P.bounce > 0) P.bounce -= 0.5 * dt;

  P.anim += (Math.abs(P.vx) * 0.5 + (v.id === "foot" ? 0.06 : 0)) * dt;

  camX = Math.max(0, Math.min(LEVEL - W, P.x - 108));
  var wantY = Math.max(-34, Math.min(0, P.y - 118));
  camY += (wantY - camY) * Math.min(1, 0.12 * dt);
}

  text(dk, W - 4 - dw + 14, 21, disksFound() === DISKS.length ? C.moss : C.mist);

  /* the route, with a tick for every section */
  var bx = 8, bw = W - 16, by = 150;
  sr(bx, by, bw, 3, C.ink);
  sr(bx, by + 1, bw, 1, C.slate);
  for (var i = 0; i < STATIONS.length; i++){
    var tx = bx + Math.round(STATIONS[i].x / LEVEL * bw);

  }

  sr(px - 1, by - 3, 3, 8, C.gold);

  if (ns >= 0 && mode === "world"){

    strip("Space  \u25b6  The arcade", C.gold, C.paper);

    strip("Space  \u25b6  Results", C.gold, C.paper);

    strip("Arrows move  \u00b7  Shift ride  \u00b7  M map", C.slate, C.haze);

    text(toast, Math.round((W - w4) / 2) + 5, 25, C.paper);

}

/* ---------------------------------------------------------------
   14. FRAME
   --------------------------------------------------------------- */
function frame(ts){
  if (!running) return;
  now = ts;
  var dt = Math.min(3, (ts - last) / 16.6667) || 1;
  last = ts;

  if (mode !== lastMode){
    if (lastMode && !reduceMotion) wipe = 9;
    lastMode = mode;
  }
  stepShake(dt);
  stepParts(dt);
  if (mode === "world"){
    step(dt);
    var nn = nearStation() >= 0;
    if (nn !== lastNear){ lastNear = nn; syncPad(); }
  }

  if (mode === "room"){
    stepRoom(dt);
    drawRoom();
    raf = requestAnimationFrame(frame);
    return;
  }
  if (mode === "game"){
    if (G && !G.over) G.update(dt);
    if (G) G.draw();
    raf = requestAnimationFrame(frame);
    return;
  }

  var t = Math.max(0, Math.min(1, P.x / LEVEL));
  drawSky(t);
  drawClouds(t);
  drawSkyline(t);
  drawHills(t);
  drawGround(t);
  drawProps(t);
  drawPlatforms();
  drawArcade();
  drawEnds();
  drawStations(t);
  drawDisks();
  for (var tr = 0; tr < trail.length; tr++){
    var q = trail[tr];
    wr(q.x, q.y, 2, 2, [C.red, C.gold, C.moss, C.cyan, C.mist][tr % 5]);
  }
  drawParts();
  drawPlayer();
  drawHud();

  if (mode === "card") drawCard();
  else if (mode === "map") drawMap();
  else if (mode === "help") drawHelp();
  else if (mode === "end") drawEnd();
  else if (mode === "intro"){
    drawIntro();
    if (now > introUntil) { mode = "world"; hintUntil = now + 7000; }
  }

  drawWipe(dt);
  drawBoot(dt);

  /* a soft vignette keeps the little screen feeling like a screen */
  ctx.fillStyle = "rgba(10,9,16,.16)";
  ctx.fillRect(0, 0, W, 1); ctx.fillRect(0, H - 1, W, 1);

  raf = requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------
   15. INPUT
   --------------------------------------------------------------- */
function press(k){
  if (mode === "intro"){ mode = "world"; hintUntil = now + 7000; return; }

  if (mode === "card"){
    if (k === "left")  cardMove(-1);
    if (k === "right") cardMove(1);
    if (k === "a" || k === "down"){
      if (card.page < card.pages.length - 1) card.page++;
      else if (card.ci < card.sec.cards.length - 1) cardMove(1);
    }
    if (k === "up") card.page = Math.max(0, card.page - 1);
    if (k === "b" || k === "back"){ mode = "world"; card = null; syncPad(); sfx("close"); }
    return;
  }

  if (mode === "map"){
    if (k === "up")   { mapSel = (mapSel + MAPROWS.length - 1) % MAPROWS.length; sfx("menu"); }
    if (k === "down") { mapSel = (mapSel + 1) % MAPROWS.length; sfx("menu"); }
    if (k === "a"){
      var row = MAPROWS[mapSel];
      P.x = row.x;
      P.y = terrain(P.x); P.vx = 0; P.vy = 0;
      camX = Math.max(0, Math.min(LEVEL - W, P.x - 108));
      mode = "world"; syncPad();
      sfx("point");
      say("Arrived at " + row.name.toLowerCase());
    }
    if (k === "b" || k === "back"){ mode = "world"; syncPad(); sfx("close"); }
    return;
  }

  if (mode === "help"){
    if (k === "a" || k === "b" || k === "back"){ mode = "world"; syncPad(); }
    return;
  }

  if (mode === "room"){
    if (k === "a"){
      if (room.door) leaveRoom();
      else if (room.sel >= 0) startGame(CABS[room.sel].id);
    }
    if (k === "b" || k === "back") leaveRoom();
    return;
  }

  if (mode === "game"){
    if (!G){ mode = "room"; syncPad(); return; }
    if (G.over){
      if (k === "a") G.reset();
      if (k === "b" || k === "back"){ mode = "room"; syncPad(); }
      return;
    }
    /* B only leaves a cabinet that does not need B to play */
    if (k === "back" || (k === "b" && !G.usesB)){ mode = "room"; syncPad(); return; }
    if (G.press) G.press(k);
    return;
  }

  if (mode === "end"){
    if (k === "a" || k === "b" || k === "back"){ mode = "world"; syncPad(); }
    return;
  }

  /* world */
  if (k === "a"){
    var ns = nearStation();
    if (ns >= 0) { openStation(ns); return; }
    if (nearArcade()){ enterRoom(); return; }
    if (nearFlag()){ mode = "end"; syncPad(); fanfare([523, 659, 784, 1047]); return; }
    var v = VEHICLES[P.veh];
    if (P.onGround && v.jump > 0) {
      P.vy = -v.jump; P.onGround = false;
      sfx(v.id === "bike" ? "hop" : "jump");
    }
    return;
  }
  if (k === "up"){
    var n2 = nearStation();
    if (n2 >= 0){ openStation(n2); return; }
    if (nearArcade()) enterRoom();
    return;
  }
  if (k === "b") setVehicle(P.veh + 1);
  if (k === "back") goPage();
}

function syncPad(){
  if (!padA) return;
  if (btnMap) btnMap.textContent = (mode === "room" || mode === "game" || mode === "end") ? "Back" : "Map";
  if (mode === "room"){ padA.textContent = room.door ? "Out" : (room.sel >= 0 ? "Play" : "\u2014"); padB.textContent = "Out"; }
  else if (mode === "game"){
    padA.textContent = (G && G.over) ? "Again" : (G && G.id === "roids" ? "Thrust" : "Go");
    padB.textContent = (G && G.usesB && !G.over) ? "Fire" : "Back";
  }
  else if (mode === "end"){ padA.textContent = "OK"; padB.textContent = "Back"; }
  else if (mode === "card"){ padA.textContent = "More"; padB.textContent = "Back"; }
  else if (mode === "map"){ padA.textContent = "Go"; padB.textContent = "Back"; }
  else if (mode === "help"){ padA.textContent = "OK"; padB.textContent = "Back"; }
  else { padA.textContent = nearStation() >= 0 ? "Read" : "Jump"; padB.textContent = "Ride"; }
}

var KEYMAP = {
  ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
  a:"left", d:"right", w:"up", s:"down",
  A:"left", D:"right", W:"up", S:"down"
};

var KON = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
var konPos = 0;
function konamiWatch(k){
  if (k === KON[konPos]){
    konPos++;
    if (konPos === KON.length){
      konPos = 0;
      konami = !konami;
      trail = [];
      say(konami ? "Konami" : "Konami off");
    }
  } else {
    konPos = (k === KON[0]) ? 1 : 0;
  }
}

function onKeyDown(e){
  if (!running) return;
  konamiWatch(e.key);
  var k = e.key, mapped = KEYMAP[k];

  if (mapped){
    keys[mapped] = true;
    if (mapped === "left" || mapped === "right") { e.preventDefault(); return; }
    if (!e.repeat) press(mapped);
    e.preventDefault();
    return;
  }
  if (k === " " || k === "Enter"){
    keys.a = true;
    if (!e.repeat) press("a");
    e.preventDefault();
    return;
  }
  if (k === "Shift" || k === "v" || k === "V"){ if (!e.repeat) press("b"); e.preventDefault(); return; }
  if (k === "Escape"){
    if (mode === "world") goPage(); else press("back");
    e.preventDefault(); return;
  }
  if (k === "m" || k === "M"){
    if (mode === "map") { mode = "world"; } else if (mode === "world") { mapSel = Math.max(0, nearStation()); mode = "map"; }
    syncPad(); e.preventDefault(); return;
  }
  if (k === "h" || k === "H" || k === "?"){
    mode = (mode === "help") ? "world" : (mode === "world" ? "help" : mode);
    syncPad(); e.preventDefault(); return;
  }
  if (k >= "1" && k <= "9"){
    var n = parseInt(k, 10) - 1;
    if (mode === "card") openLink(n);
    else if (n < VEHICLES.length) setVehicle(n);
    e.preventDefault();
  }
}

function onKeyUp(e){
  var mapped = KEYMAP[e.key];
  if (mapped) keys[mapped] = false;
  if (e.key === " " || e.key === "Enter") keys.a = false;
}

/* pointer: click links inside a card, tap the map, dismiss the intro */
function canvasPoint(ev){
  var r = cv.getBoundingClientRect();
  return { x:(ev.clientX - r.left) / r.width * W, y:(ev.clientY - r.top) / r.height * H };
}
cv.addEventListener("pointerdown", function(ev){
  if (!running) return;
  cv.focus();
  var p = canvasPoint(ev), i;
  if (mode === "intro"){ press("a"); return; }
  if (mode === "card"){
    for (i = 0; i < card.hits.length; i++){
      var h = card.hits[i];
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h){ openLink(h.link); return; }
    }
    if (p.y > H - 16) { mode = "world"; card = null; syncPad(); return; }
    press("a");
    return;
  }
  if (mode === "map"){
    var idx = Math.floor((p.y - 18) / 13);
    if (idx >= 0 && idx < STATIONS.length){ mapSel = idx; press("a"); }
    return;
  }
  if (mode === "help"){ mode = "world"; syncPad(); }
});

/* touch pad wiring */
function bindPad(btn){
  var k = btn.getAttribute("data-k");
  function down(ev){
    ev.preventDefault();
    btn.classList.add("hot");
    if (k === "left" || k === "right") keys[k] = true;
    else keys[k] = true;
    press(k);
  }
  function up(ev){
    ev.preventDefault();
    btn.classList.remove("hot");
    keys[k] = false;
  }
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointerleave", up);
  btn.addEventListener("pointercancel", up);
}
if (padEl) Array.prototype.forEach.call(padEl.querySelectorAll("button"), bindPad);

function resize(){
  var padY = padEl && padEl.classList.contains("on") ? 96 : 40;
  var sx = (window.innerWidth - 32) / W;
  var sy = (window.innerHeight - padY) / H;
  var s = Math.max(1, Math.min(sx, sy));
  s = s >= 2 ? Math.floor(s) : s;           /* integer scale once there is room for it */
  cv.style.width  = Math.round(W * s) + "px";
  cv.style.height = Math.round(H * s) + "px";
}
window.addEventListener("resize", function(){ if (running) resize(); });

/* ---- persistence: works on a real host, shrugs anywhere else ---- */
var memBest = {};
function bestOf(id){
  if (memBest[id] !== undefined) return memBest[id];
  var v = 0;
  try { v = parseInt(window.localStorage.getItem("arcade.best." + id), 10) || 0; } catch(e){ v = 0; }
  memBest[id] = v;
  return v;
}
function setBest(id, v){
  if (v <= bestOf(id)) return;
  memBest[id] = v;
  try { window.localStorage.setItem("arcade.best." + id, String(v)); } catch(e){}
}

function disksFound(){
  var n = 0;
  for (var i = 0; i < DISKS.length; i++) if (DISKS[i].got) n++;
  return n;
}
function nearArcade(){ return Math.abs(P.x - ARCADE_X) < 28; }
function nearFlag(){ return Math.abs(P.x - FLAG_X) < 30; }

/* ---- the floppies and the ledges they sit on ---- */
function drawPlatforms(){
  for (var i = 0; i < PLATFORMS.length; i++){
    var p = PLATFORMS[i];
    if (p.x - camX < -60 || p.x - camX > W + 20) continue;
    wr(p.x, p.y, p.w, 2, C.mist);
    wr(p.x, p.y + 2, p.w, 3, C.slate);
    wr(p.x + 2, p.y + 5, 2, 4, C.grey);
    wr(p.x + p.w - 4, p.y + 5, 2, 4, C.grey);
  }
}

function drawDisks(){
  var bob = reduceMotion ? 0 : Math.round(Math.sin(now / 300) * 1.5);
  for (var i = 0; i < DISKS.length; i++){
    var d = DISKS[i];
    if (d.got) continue;
    if (d.x - camX < -20 || d.x - camX > W + 20) continue;
    var y = d.y + bob;
    wr(d.x - 4, y - 4, 9, 9, C.ink);
    wr(d.x - 3, y - 3, 7, 3, C.mist);
    wr(d.x - 1, y - 3, 3, 2, C.slate);
    wr(d.x - 3, y + 1, 7, 3, C.cyan);
  }
}

function grabDisks(){
  for (var i = 0; i < DISKS.length; i++){
    var d = DISKS[i];
    if (d.got) continue;
    if (Math.abs(d.x - P.x) < 11 && Math.abs(d.y - (P.y - 10)) < 14){
      d.got = true;
      var n = disksFound();
      spawn(d.x, d.y, 10, C.cyan, "pop");
      if (n === DISKS.length) fanfare([659, 784, 988, 1319]); else sfx("pick");
      say(n === DISKS.length ? "Every floppy found" : "Floppy  " + n + "/" + DISKS.length);
    }
  }
}

/* ===============================================================
   16c. THE ROOM
   =============================================================== */
var room = { x:120, vx:0, face:1, anim:0, sel:-1, door:false };
var CABS = [
  { id:"snake", name:"SNAKE",     x: 56, col:C.moss },
  { id:"roids", name:"ASTEROIDS", x:120, col:C.cyan },
  { id:"brick", name:"BREAKOUT",  x:184, col:C.red  }
];

function enterRoom(){
  room.x = 120; room.vx = 0; room.face = 1; room.sel = -1; room.door = false;
  mode = "room"; syncPad();
}
function leaveRoom(){
  P.x = ARCADE_X; P.y = terrain(P.x); P.vx = 0; P.vy = 0;
  mode = "world"; syncPad();
}

function stepRoom(dt){
  var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir){ room.vx += dir * 0.3 * dt; room.face = dir; }
  else room.vx *= Math.pow(0.72, dt);
  room.vx = Math.max(-1.3, Math.min(1.3, room.vx));
  room.x += room.vx * dt;
  room.x = Math.max(20, Math.min(W - 20, room.x));
  room.anim += Math.abs(room.vx) * 0.5 * dt;

  var was = room.sel, wasDoor = room.door;
  room.door = room.x < 32;
  room.sel = -1;
  if (!room.door){
    var bd = 1e9;
    for (var i = 0; i < CABS.length; i++){
      var d = Math.abs(room.x - CABS[i].x);
      if (d < bd){ bd = d; room.sel = i; }
    }
  }
  if (was !== room.sel || wasDoor !== room.door) syncPad();
}

function walker(x, y, f, anim, moving){
  var bob = moving && !reduceMotion ? Math.round(Math.sin(anim * 2) * 0.6) : 0;
  y += bob;
  sr(x - 3, y - 21, 7, 3, C.gold);
  sr(x - 3 + (f > 0 ? 4 : -2), y - 20, 3, 1, C.gold);
  sr(x - 2, y - 18, 5, 4, C.mist);
  sr(x + (f > 0 ? 1 : -2), y - 17, 1, 1, C.ink);
  sr(x - 3, y - 14, 7, 7, C.deep);
  sr(x - 3, y - 13, 7, 1, C.sky);
  var sw = moving ? Math.sin(anim) * 2.5 : 0;
  sr(x - 3 + Math.round(2 + sw), y - 7, 2, 7, C.ink);
  sr(x - 3 + Math.round(2 - sw), y - 7, 2, 7, C.shadow);
}

function drawRoom(){
  var WALL = 116, FEET = 138;
  sr(0, 0, W, H, mix(C.night, C.black, 0.5));
  for (var b = 0; b < 7; b++) sr(0, b * 4, W, 2, mix(C.night, C.black, 0.28 + b * 0.04));

  /* two posters and a strip light */
  sr(16, 24, 26, 20, C.shadow); sr(18, 26, 22, 12, C.deep);  sr(18, 40, 14, 2, C.haze);
  sr(198, 28, 26, 18, C.shadow); sr(200, 30, 22, 10, C.rust); sr(200, 42, 12, 2, C.haze);
  sr(96, 20, 48, 2, C.gold);

  /* the way out, at the left-hand wall */
  sr(2, WALL - 36, 20, 36, C.black);
  sr(2, WALL - 36, 20, 2, C.grey);
  sr(4, WALL - 32, 16, 26, mix(C.night, C.black, 0.7));
  text("out", 4, WALL - 30, room.door ? C.gold : C.haze);

  for (var i = 0; i < CABS.length; i++){
    var c = CABS[i], x = c.x, on = room.sel === i;
    sr(x - 13, WALL - 44, 26, 44, on ? C.slate : C.ink);
    sr(x - 13, WALL - 47, 26, 3, c.col);
    sr(x - 10, WALL - 41, 20, 15, C.black);
    var ph = Math.floor(now / 160 + i * 3);
    if (c.id === "snake"){
      for (var s2 = 0; s2 < 4; s2++) sr(x - 8 + ((ph + s2) % 9) * 2, WALL - 35, 2, 2, c.col);
    } else if (c.id === "roids"){
      sr(x - 9 + (ph % 18), WALL - 37, 3, 3, c.col);
      sr(x + 6 - (ph % 16), WALL - 31, 2, 2, C.mist);
    } else {
      for (var k2 = 0; k2 < 5; k2++) sr(x - 9 + k2 * 4, WALL - 39, 3, 2, c.col);
      sr(x - 9 + (ph % 17), WALL - 31, 2, 2, C.mist);
    }
    sr(x - 10, WALL - 23, 20, 5, C.shadow);
    sr(x - 6, WALL - 22, 3, 3, c.col);
    sr(x + 3, WALL - 22, 3, 3, C.gold);
    sr(x - 13, WALL - 3, 26, 3, mix(C.black, C.ink, 0.5));
  }

  /* the floor the visitor actually stands on */
  sr(0, WALL, W, H - WALL, C.shadow);
  sr(0, WALL, W, 1, C.grey);
  for (var t2 = 0; t2 < W; t2 += 10) sr(t2, WALL + 20, 5, 2, mix(C.shadow, C.black, 0.55));
  sr(0, FEET + 2, W, 1, mix(C.shadow, C.black, 0.4));
  sr(Math.round(room.x) - 5, FEET, 10, 2, mix(C.shadow, C.black, 0.6));

  walker(Math.round(room.x), FEET, room.face, room.anim, Math.abs(room.vx) > 0.15);

  sr(0, 0, W, 14, C.ink); sr(0, 14, W, 1, C.slate);
  text("THE ARCADE", 6, 3, C.gold);
  textRight("Esc  out", W - 6, 3, C.haze);

  var msg = null;
  if (room.door) msg = "Space  \u25b6  back to the road";
  else if (room.sel >= 0) msg = "Space  \u25b6  " + CABS[room.sel].name + "    best " + bestOf(CABS[room.sel].id);
  if (msg){
    var w2 = textWidth(msg) + 10, x2 = Math.max(2, Math.round((W - w2) / 2));
    panel(x2, 144, Math.min(w2, W - 4), 13, C.ink, C.gold);
    text(msg, x2 + 5, 147, C.paper);
  } else {
    textCentre("three cabinets, one door", W / 2, 147, C.grey);
  }
}

/* ===============================================================
   16d. THE CABINETS
   =============================================================== */
function fillPoly(pts, col){
  var minY = 1e9, maxY = -1e9, i;
  for (i = 0; i < pts.length; i++){ if (pts[i][1] < minY) minY = pts[i][1]; if (pts[i][1] > maxY) maxY = pts[i][1]; }
  for (var y = Math.floor(minY); y <= Math.ceil(maxY); y++){
    var xs = [];
    for (i = 0; i < pts.length; i++){
      var a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y))
        xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    }
    xs.sort(function(p, q){ return p - q; });
    for (i = 0; i + 1 < xs.length; i += 2)
      sr(Math.round(xs[i]), y, Math.max(1, Math.round(xs[i + 1] - xs[i])), 1, col);
  }
}

function endGame(g){
  g.newBest = g.score > 0 && g.score > bestOf(g.id);
